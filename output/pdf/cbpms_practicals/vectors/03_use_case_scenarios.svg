<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect x="0" y="0" width="1200" height="850" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/>
<rect x="35" y="32" width="6" height="50" rx="0" fill="#316452" stroke="#316452" stroke-width="1.3"/>
<text x="56" y="51.0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#316452">CBPMS / SOFTWARE ENGINEERING &amp; PROJECT MANAGEMENT</text>
<text x="56" y="87.0" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#243832">Use-case scenarios</text>
<text x="56" y="113.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#54665f">Four representative scenarios. IDs match the use-case diagram; exceptions and privacy rules are part of the expected behaviour.</text>
<polyline points="35,127 1165,127" fill="none" stroke="#9aaa9f" stroke-width="1.4"/>
<polyline points="35,797 1165,797" fill="none" stroke="#9aaa9f" stroke-width="1.4"/>
<text x="35" y="822.0" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#54665f">Cloud Based Print Management System  |  Academic design model  |  09 Oct 2026</text>
<text x="1148.32" y="824.0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#243832">03</text>
<rect x="35" y="150" width="555" height="307" rx="8" fill="#ffffff" stroke="#9aaa9f" stroke-width="1.3"/>
<rect x="35" y="150" width="555" height="38" rx="8" fill="#dcece4" stroke="#9aaa9f" stroke-width="1.3"/>
<text x="51" y="176.0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#243832">UC01 / Sign in with Google</text>
<text x="51" y="210.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ACTOR / TRIGGER</text>
<text x="51" y="226.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Customer selects Continue with Google.</text>
<text x="51" y="249.25" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">PRECONDITION</text>
<text x="51" y="265.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Google provider and callback URL are configured.</text>
<text x="51" y="288.5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">MAIN FLOW</text>
<text x="51" y="305.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">1. Redirect for Google consent. 2. Exchange the authorization code. 3. Verify identity and</text>
<text x="51" y="321.25" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">establish a secure session. 4. Open the customer workspace.</text>
<text x="51" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ALTERNATIVE</text>
<text x="51" y="360.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Cancelled or invalid authorization returns a safe error; no authenticated session is created.</text>
<text x="51" y="383.25" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">POSTCONDITION</text>
<text x="51" y="399.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">A returning identity is reused; a new identity gets a customer profile. No staff permissions are</text>
<text x="51" y="416.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">granted.</text>
<rect x="610" y="150" width="555" height="307" rx="8" fill="#ffffff" stroke="#9aaa9f" stroke-width="1.3"/>
<rect x="610" y="150" width="555" height="38" rx="8" fill="#dcece4" stroke="#9aaa9f" stroke-width="1.3"/>
<text x="626" y="176.0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#243832">UC02 / Submit a print job</text>
<text x="626" y="210.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ACTOR / TRIGGER</text>
<text x="626" y="226.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Customer chooses a shop and starts an upload.</text>
<text x="626" y="249.25" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">PRECONDITION</text>
<text x="626" y="265.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Shop is active; account mode requires sign-in.</text>
<text x="626" y="288.5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">MAIN FLOW</text>
<text x="626" y="305.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">1. Choose privacy mode. 2. Upload PDF/image. 3. Server validates and prices options. 4.</text>
<text x="626" y="321.25" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Stage job privately. 5. Verify payment on server. 6. Queue job and issue release PIN.</text>
<text x="626" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ALTERNATIVE</text>
<text x="626" y="360.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Invalid file is rejected. Failed or unavailable payment does not queue the job or issue a release</text>
<text x="626" y="376.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">PIN.</text>
<text x="626" y="399.5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">POSTCONDITION</text>
<text x="626" y="416.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Job belongs to one shop. A capability token protects anonymous status. Live payment</text>
<text x="626" y="432.25" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">remains planned.</text>
<rect x="35" y="468" width="555" height="307" rx="8" fill="#ffffff" stroke="#9aaa9f" stroke-width="1.3"/>
<rect x="35" y="468" width="555" height="38" rx="8" fill="#f7eedc" stroke="#9aaa9f" stroke-width="1.3"/>
<text x="51" y="494.0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#243832">UC07 / Release job for printing</text>
<text x="51" y="528.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ACTOR / TRIGGER</text>
<text x="51" y="544.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Shop operator scans or enters a release PIN.</text>
<text x="51" y="567.25" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">PRECONDITION</text>
<text x="51" y="583.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Staff belongs to the job shop; paid job is unexpired.</text>
<text x="51" y="606.5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">MAIN FLOW</text>
<text x="51" y="623.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">1. Atomically claim job. 2. Issue a short-lived download grant. 3. Agent downloads and verifies</text>
<text x="51" y="639.25" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">hash. 4. Spool to printer. 5. Report outcome and clear local temporary file.</text>
<text x="51" y="662.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ALTERNATIVE</text>
<text x="51" y="678.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Wrong shop, invalid PIN or duplicate claim is denied. Spool failure is reported; retain cloud file</text>
<text x="51" y="694.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">for retry until expiry.</text>
<text x="51" y="717.5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">POSTCONDITION</text>
<text x="51" y="734.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Spool success marks completion. Anonymous cloud file is deleted; a reusable library file</text>
<text x="51" y="750.25" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">remains private.</text>
<rect x="610" y="468" width="555" height="307" rx="8" fill="#ffffff" stroke="#9aaa9f" stroke-width="1.3"/>
<rect x="610" y="468" width="555" height="38" rx="8" fill="#f7eedc" stroke="#9aaa9f" stroke-width="1.3"/>
<text x="626" y="494.0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#243832">UC04 / Manage private library</text>
<text x="626" y="528.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ACTOR / TRIGGER</text>
<text x="626" y="544.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Signed-in customer opens the document library.</text>
<text x="626" y="567.25" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">PRECONDITION</text>
<text x="626" y="583.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">A valid customer session identifies the owner.</text>
<text x="626" y="606.5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">MAIN FLOW</text>
<text x="626" y="623.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">1. List only the owner&#x27;s account-linked documents. 2. Choose a document to reuse or delete.</text>
<text x="626" y="639.25" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">3. Check ownership and active jobs. 4. Apply the permitted operation.</text>
<text x="626" y="662.0" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">ALTERNATIVE</text>
<text x="626" y="678.5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Other owners&#x27; files are inaccessible. Deletion during an active print job is blocked; retry after</text>
<text x="626" y="694.75" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">the job finishes.</text>
<text x="626" y="717.5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#316452">POSTCONDITION</text>
<text x="626" y="734.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">Reusable documents remain private. Deleted documents become inaccessible. Anonymous</text>
<text x="626" y="750.25" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#243832">uploads never appear here.</text>
</svg>