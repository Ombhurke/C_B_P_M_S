<text x="47" y="693.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#243832">External entities are rectangles; the rounded process represents the entire platform.</text>
<text x="47" y="711.2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#243832">Arrows carry named data, not execution order.</text>
