<text x="622" y="693.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#243832">Internal databases and private object storage are hidden at context level. They</text>
<text x="622" y="711.2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#243832">appear as data stores in Level 1.</text>
<text x="35" y="767.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#54665f">Design scope: live payment integration is proposed; Google authentication and anonymous job mode are part of the current design.</text>
